<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <style>
      .lattice-main { fill: none; stroke: #1b7a2f; stroke-width: 1.25; stroke-opacity: 0.16; stroke-linecap: round; stroke-linejoin: round; }
      .lattice-sub  { fill: none; stroke: #1b7a2f; stroke-width: 0.9; stroke-opacity: 0.12; stroke-linecap: round; stroke-linejoin: round; }
      .lattice-accent { fill: #1b7a2f; fill-opacity: 0.05; stroke: #1b7a2f; stroke-width: 0.8; stroke-opacity: 0.15; }
      .lattice-dot  { fill: #1b7a2f; fill-opacity: 0.20; }
    </style>
  </defs>
  <!-- Outer primary diamond grid (tiles seamlessly across 60x60) -->
  <path class="lattice-main" d="M30 0 L60 30 L30 60 L0 30 Z" />
  
  <!-- Diagonal crossing corner lines -->
  <path class="lattice-main" d="M0 0 L18 18 M42 18 L60 0 M60 60 L42 42 M18 42 L0 60" />
  <path class="lattice-sub" d="M0 0 L60 60 M60 0 L0 60" />
  
  <!-- Inner diamond -->
  <path class="lattice-main" d="M30 12 L48 30 L30 48 L12 30 Z" />
  
  <!-- Central 8-pointed star rosette -->
  <polygon class="lattice-accent" points="30,22 32.5,26 38,26 34,30 36.5,35 30,32 23.5,35 26,30 22,26 27.5,26" />
  <circle cx="30" cy="30" r="2" class="lattice-dot" />
  
  <!-- Corner 8-pointed quarter rosettes -->
  <circle cx="0" cy="0" r="2.5" class="lattice-dot" />
  <circle cx="60" cy="0" r="2.5" class="lattice-dot" />
  <circle cx="0" cy="60" r="2.5" class="lattice-dot" />
  <circle cx="60" cy="60" r="2.5" class="lattice-dot" />
  
  <!-- Midpoint vertex accent dots -->
  <circle cx="30" cy="0" r="1.5" class="lattice-dot" />
  <circle cx="60" cy="30" r="1.5" class="lattice-dot" />
  <circle cx="30" cy="60" r="1.5" class="lattice-dot" />
  <circle cx="0" cy="30" r="1.5" class="lattice-dot" />
</svg>